[package]
name = "tinyusd-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[lib]
name = "tinyusd"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["shade", "lux", "skel", "physics", "vol", "media", "semantics", "write"]
shade = ["tinyusd-core/shade"]
lux = ["tinyusd-core/lux"]
skel = ["tinyusd-core/skel"]
physics = ["tinyusd-core/physics"]
vol = ["tinyusd-core/vol"]
media = ["tinyusd-core/media"]
semantics = ["tinyusd-core/semantics"]
write = ["tinyusd-core/write"]

[dependencies]
tinyusd-core.workspace = true

[dev-dependencies]
cbindgen = { version = "0.29.4", default-features = false }
serde_json = "1"

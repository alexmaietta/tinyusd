# Vendored from https://github.com/mxpv/openusd at rev 78622a8b, crates/openusd.
# The manifest drops workspace inheritance, tests and fixtures. The source differs from upstream only by
# the asset value fix listed in tinyusd's README.
[package]
name = "openusd"
description = "Rust native USD library"
version = "0.8.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/mxpv/openusd"
license = "MIT"
readme = "README.md"

[features]
mmap = ["dep:memmap2"]
serde = ["dep:serde", "half/serde"]

[dependencies]
bitflags = "2.11.1"
bytemuck = { version = "1.14.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "add", "add_assign", "mul", "mul_assign", "not", "sum", "from", "into"] }
half = { version = "2.3.1", features = ["bytemuck", "num-traits"] }
logos = "0.16.0"
lz4_flex = "0.14.0"
memmap2 = { version = "0.9", optional = true }
num-traits = "0.2.17"
regex-lite = "0.1.9"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"], optional = true }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
zmij = "1.0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

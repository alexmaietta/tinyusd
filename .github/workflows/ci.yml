name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tinyusd-core --no-default-features --all-targets -- -D warnings
      - run: cargo test -p tinyusd-core
      - run: cargo test -p tinyusd-core --no-default-features
      - run: cargo test -p tinyusd-capi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --no-report -p tinyusd-core -p tinyusd-capi --all-features
      - run: |
          cargo llvm-cov report --html --output-dir report
          mkdir coverage
          mv report/html/* coverage/
          cargo llvm-cov report --json --summary-only --output-path summary.json
      - name: Badge and summary
        shell: python
        run: |
          import json, os
          lines = json.load(open("summary.json"))["data"][0]["totals"]["lines"]
          percent = round(lines["percent"], 1)
          color = next(c for t, c in [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"), (0, "red")] if percent >= t)
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{percent}%", "color": color}, open("coverage/badge.json", "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Coverage\n\nLines {percent}% ({lines['covered']} of {lines['count']})\n")
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

  pages:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: site/coverage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        static: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cmake-${{ matrix.static }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTINYUSD_STATIC=${{ matrix.static }}
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"
      - run: cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - run: cmake --build build-consumer --config Release
      - run: ctest --test-dir build-consumer -C Release --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/install/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/install/lib

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test]
      - run: pytest -q

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p tinyusd-core --example dump
      - run: pip install usd-core
      - run: python tests/oracle/compare.py --schemas tests/data/schemas/demo tests/data/*.usda tests/data/*.usdc tests/data/*.usdz
      - run: python tests/oracle/compare.py --schemas tests/data/schemas/demo --instance-proxies tests/data/*.usda tests/data/*.usdc tests/data/*.usdz
      - run: python tests/oracle/compare.py --schemas tests/data/schemas/demo --helpers tests/data/*.usda tests/data/*.usdc tests/data/*.usdz
      - run: python tests/oracle/compare.py --schemas tests/data/schemas/demo --physics tests/data/physics.usda tests/data/physics_full.usda
      - run: |
          for t in 0 2.5 5 10; do
            python tests/oracle/compare.py --schemas tests/data/schemas/demo --helpers --time $t tests/data/*.usda tests/data/*.usdc tests/data/*.usdz
          done
      - name: Kitchen Set
        run: |
          curl -sSfL -o kitchen.zip https://openusd.org/files/Kitchen_set.zip
          unzip -q kitchen.zip -d kitchen
          python tests/oracle/compare.py --schemas tests/data/schemas/demo kitchen/Kitchen_set/Kitchen_set.usd kitchen/Kitchen_set/Kitchen_set_instanced.usd
          python tests/oracle/compare.py --schemas tests/data/schemas/demo --instance-proxies kitchen/Kitchen_set/Kitchen_set_instanced.usd
          python tests/oracle/compare.py --schemas tests/data/schemas/demo --helpers kitchen/Kitchen_set/Kitchen_set.usd kitchen/Kitchen_set/Kitchen_set_instanced.usd

  oracle-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p tinyusd-core --example dump
      - run: pip install . usd-core
      - name: Write scenes with tinyusd
        run: python tests/oracle/write_scenes.py written
      - name: OpenUSD reads them as tinyusd does
        run: |
          python tests/oracle/compare.py --helpers written/*.usda written/*.usdc written/*.usdz
          python tests/oracle/compare.py --instance-proxies written/*.usda written/*.usdc written/*.usdz
          python tests/oracle/compare.py --physics written/physics_*.usda written/written.usda
          for t in 0 4 10; do
            python tests/oracle/compare.py --helpers --time $t written/written.usda written/overlay.usda written/physics_written.usda written/clips.usda
          done
      - name: OpenUSD's validators accept them
        run: python tests/oracle/validate.py written/written.usda written/written.usdc written/flattened.usdz written/overlay.usda written/physics_written.usda written/variants.usda written/clips.usda

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each reader for a minute
        working-directory: fuzz
        run: |
          for target in open_usda open_usdc open_usdz; do
            cargo fuzz run -O --target x86_64-unknown-linux-gnu "$target" "corpus/$target" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -max_len=262144
          done
      - name: Fuzz edit sequences for a minute
        working-directory: fuzz
        run: |
          mkdir -p corpus/edit_sequence
          cargo fuzz run -O --target x86_64-unknown-linux-gnu edit_sequence corpus/edit_sequence -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -max_len=1024
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tinyusd-capi
      - run: |
          size=$(stat -c %s target/release/libtinyusd.so)
          gz=$(gzip -9 -c target/release/libtinyusd.so | wc -c)
          echo "### libtinyusd.so: $size bytes ($gz gzipped)" >> "$GITHUB_STEP_SUMMARY"

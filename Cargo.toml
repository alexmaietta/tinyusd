[workspace]
resolver = "3"
members = ["crates/tinyusd-core", "crates/tinyusd-capi", "crates/tinyusd-py"]
default-members = ["crates/tinyusd-core", "crates/tinyusd-capi"]
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "BSD-3-Clause"

[workspace.dependencies]
tinyusd-core = { path = "crates/tinyusd-core", default-features = false }
openusd = { git = "https://github.com/mxpv/openusd", rev = "78622a8b", features = ["mmap"] }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "78622a8b", default-features = false }
openusd-build = { git = "https://github.com/mxpv/openusd", rev = "78622a8b" }
thiserror = "2"

# openusd and openusd-build are vendored with the small changes the README lists under "Vendored openusd".
[patch."https://github.com/mxpv/openusd"]
openusd = { path = "vendor/openusd" }
openusd-build = { path = "vendor/openusd-build" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
